services:
  - type: web
    name: foster-home-capacity-explorer
    runtime: docker
    plan: free
    region: ohio
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    autoDeployTrigger: checksPass
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      - key: HOSTNAME
        value: 0.0.0.0

      - key: PORT
        value: "10000"

      - key: FOSTER_DATABASE_PATH
        value: /app/data/generated/foster_capacity.db
